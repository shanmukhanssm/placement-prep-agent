[project]
name = "prep-agent"
version = "0.1.0"
description = "placement-prep-agent — a LangGraph placement-preparation coach (single-user, turn-based CLI)"
requires-python = ">=3.11"
# Pinned per library-docs.md version policy ("pin at Phase 0") — closed dependency list
# (code-standards.md); dev tooling lives in the `dev` extra.
dependencies = [
    "langgraph==1.2.11",
    "langchain-openai==1.6.2",
    "langgraph-checkpoint-sqlite==3.1.1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
    "mypy>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prep_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_openai.*", "langchain_core.*", "langgraph_checkpoint_sqlite.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: Layer 1 deterministic tests (tools, compute_trend properties, routing edges)",
    "e2e: end-to-end golden-case runs (excluded from unit runs)",
    "eval: Layers 2-5 eval scripts",
]
